<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Деҳа</title>
<style>
  body{margin:0;font-family:sans-serif;background:#f3f1ea;color:#222}
  header{background:#2f6b3a;color:#fff;padding:12px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
  header button{background:transparent;color:#fff;border:1px solid #fff;border-radius:6px;padding:4px 10px;font-size:13px;display:none}
  nav{display:flex}
  nav button{flex:1;padding:12px;border:0;background:#dfe8dc;font-size:16px}
  nav button.on{background:#fff;font-weight:bold}
  section{display:none;padding:10px}
  section.on{display:block}
  .box{background:#fff;border-radius:8px;padding:8px;margin-bottom:8px}
  .t{font-size:12px;color:#777}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;font-size:16px}
  .send{background:#2f6b3a;color:#fff;border:0;padding:10px 16px;font-size:16px;border-radius:6px}
  #msgs{height:60vh;overflow-y:auto}
  #auth{padding:16px}
  #aerr{color:#b00020;font-size:14px;min-height:20px;margin:6px 0}
  .link{color:#2f6b3a;text-decoration:underline;margin-top:14px}
</style>
</head>
<body>
<header><span>🏡 Деҳа</span><button id="out" onclick="logout()">Баромадан</button></header>

<div id="auth">
  <h3 id="atitle">Воридшавӣ</h3>
  <input id="rname" placeholder="Номи шумо" style="display:none">
  <input id="phone" type="tel" placeholder="Рақами телефон (+992...)">
  <input id="pass" type="password" placeholder="Парол (камаш 6 аломат)">
  <div id="aerr"></div>
  <button class="send" id="abtn" onclick="submitAuth()">Ворид шудан</button>
  <p class="link" id="alink" onclick="toggleMode()">Сабти ном</p>
</div>

<div id="app" style="display:none">
  <nav>
    <button id="b1" class="on" onclick="tab(1)">Чат</button>
    <button id="b2" onclick="tab(2)">Хабарҳо</button>
    <button id="b3" onclick="tab(3)">Админ</button>
  </nav>
  <section id="s1" class="on">
    <div id="msgs"></div>
    <input id="text" placeholder="Паём нависед...">
    <button class="send" onclick="sendChat()">Фиристодан</button>
  </section>
  <section id="s2"><div id="news"></div></section>
  <section id="s3">
    <input id="pw" type="password" placeholder="Пароли админ">
    <input id="nt" placeholder="Сарлавҳа">
    <textarea id="nx" rows="5" placeholder="Матни хабар"></textarea>
    <button class="send" onclick="sendNews()">Нашр кардан</button>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let mode = 'login';
let socket = null;

function toggleMode(){
  mode = mode === 'login' ? 'register' : 'login';
  const reg = mode === 'register';
  $('rname').style.display = reg ? 'block' : 'none';
  $('atitle').textContent = reg ? 'Сабти ном' : 'Воридшавӣ';
  $('abtn').textContent = reg ? 'Сабти ном кардан' : 'Ворид шудан';
  $('alink').textContent = reg ? 'Ман ҳисоб дорам' : 'Сабти ном';
  $('aerr').textContent = '';
}

async function submitAuth(){
  $('aerr').textContent = 'Интизор шавед...';
  try {
    const r = await fetch('/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: $('rname').value,
        phone: $('phone').value,
        password: $('pass').value
      })
    });
    const d = await r.json();
    if (!r.ok) { $('aerr').textContent = d.error || 'Хато'; return; }
    localStorage.setItem('token', d.token);
    start(d.token);
  } catch (e) {
    $('aerr').textContent = 'Пайваст нашуд. Дубора кӯшиш кунед.';
  }
}

function logout(){
  localStorage.removeItem('token');
  location.reload();
}

function tab(n){
  for(let i=1;i<=3;i++){
    $('s'+i).classList.toggle('on', i===n);
    $('b'+i).classList.toggle('on', i===n);
  }
}

function card(a, b, time){
  const d = document.createElement('div'); d.className = 'box';
  const h = document.createElement('b'); h.textContent = a;
  const p = document.createElement('div'); p.textContent = b;
  const t = document.createElement('div'); t.className = 't';
  t.textContent = new Date(time).toLocaleString();
  d.append(h, p, t);
  return d;
}
function addChat(m){
  const box = $('msgs'); box.append(card(m.name, m.text, m.time));
  box.scrollTop = box.scrollHeight;
}
function addNews(n, top){
  const c = card(n.title, n.text, n.time);
  top ? $('news').prepend(c) : $('news').append(c);
}

function start(token){
  $('auth').style.display = 'none';
  $('app').style.display = 'block';
  $('out').style.display = 'block';
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => {
    if (e && e.message === 'auth') logout();
  });
  socket.on('init', (d) => {
    $('msgs').innerHTML = ''; $('news').innerHTML = '';
    d.chat.forEach(addChat);
    d.news.forEach((n) => addNews(n, false));
  });
  socket.on('chat', addChat);
  socket.on('news', (n) => addNews(n, true));
  socket.on('err', (e) => alert(e));
}

function sendChat(){
  const text = $('text').value.trim();
  if(!text || !socket) return;
  socket.emit('chat', { text });
  $('text').value = '';
}
function sendNews(){
  if(!socket) return;
  socket.emit('news', { password: $('pw').value, title: $('nt').value, text: $('nx').value });
  $('nt').value = ''; $('nx').value = '';
}

const saved = localStorage.getItem('token');
if (saved) start(saved);
</script>
</body>
</html>
