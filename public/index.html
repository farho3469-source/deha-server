<!DOCTYPE html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мебел 3D</title>
<style>
:root{--bg:#e4e8ee;--fg:#1d2330;--card:#fff;--ac:#00838f;--bd:#cfd5de}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a21;--fg:#eceff4;--card:#242a34;--ac:#26c6da;--bd:#3a4250}}
:root[data-theme="dark"]{--bg:#161a21;--fg:#eceff4;--card:#242a34;--ac:#26c6da;--bd:#3a4250}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--ac)}
#top button{border:0;border-radius:10px;padding:10px 12px;font-size:15px;background:rgba(255,255,255,.2);color:#fff;font-family:inherit}
#top input[type=color]{width:42px;height:40px;padding:2px;border:2px solid #fff;border-radius:10px;background:none;margin-left:auto}
#pn,.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(0,0,0,.25);display:none}
#pn.on,.sheet.on{display:block}
.sheet{max-height:75vh;overflow-y:auto;z-index:5}
.row{display:flex;gap:8px;margin:6px 0;align-items:flex-end}
.row label{flex:1;font-size:12px;color:#7a8494;display:block}
input[type=number]{width:100%;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
.row input[type=color]{width:100%;height:42px;border:1px solid var(--bd);border-radius:10px;padding:2px;background:var(--bg)}
.b{border:0;border-radius:10px;padding:11px 14px;font-size:16px;background:var(--ac);color:#fff;font-family:inherit}
.b.g{background:var(--bg);color:var(--fg)}
.it{display:block;width:100%;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--fg);font-size:17px;font-family:inherit}
.sheet h3{margin:0 0 6px;font-size:19px}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--fg)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sq{height:84px;border:3px solid transparent;border-radius:10px;background-size:cover;padding:0;color:#fff;font-size:12px;text-align:left;font-family:inherit;display:flex;align-items:flex-end}
.sq span{background:rgba(0,0,0,.55);width:100%;padding:3px 5px;border-radius:0 0 7px 7px}
.sq.on{border-color:var(--ac)}
.sw{width:100%;height:64px;object-fit:cover;border-radius:8px;margin-top:4px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><button id="bR">🏠 Хона</button><button id="bA">➕ Илова</button><button id="bS"></button><button id="bC" style="margin-left:auto">🎨 Ранг</button></div>

<div id="pn">
  <div class="row"><label>Дарозӣ<input type="number" id="iw"></label><label>Баландӣ<input type="number" id="ih"></label><label>Умқ<input type="number" id="id"></label></div>
  <div class="row"><button class="b" id="bRot">⟳ Давр</button><button class="b g" id="bCp">⧉ Нусха</button><button class="b g" id="bDl">🗑 Нест</button></div>
</div>

<div class="sheet" id="shR"><button class="x" aria-label="Бастан">✕</button><h3>Хона (см)</h3>
  <div class="row"><label>Дарозӣ<input type="number" id="rw"></label><label>Умқ<input type="number" id="rd"></label><label>Баландӣ<input type="number" id="rh"></label></div>
  <div class="row"><label>Ранги девор<input type="color" id="rwc"></label><label>Ранги фарш<input type="color" id="rfl"></label></div>
</div>
<div class="sheet" id="shA"><button class="x" aria-label="Бастан">✕</button><h3>Илова кардан</h3><div id="lst"></div></div>
<div class="sheet" id="shC"><button class="x" aria-label="Бастан">✕</button><h3>Ранг ва декор</h3><div id="cb"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),Q=Math.PI/180;
let W=400,D=300,H=260,wc='#ece8e0',fl='#e4e1da',style='classic',fac='#f8f6f0',items=[],sel=null,P={fas:1,up:1,kor:0,top:0,col:0,hand:0};
try{const s=JSON.parse(localStorage.getItem('m4')||'null');if(s){({W,D,H,wc,fl,style}=s);if(s.P)P=s.P;items=s.items||[]}}catch(e){}
const sv=()=>{try{localStorage.setItem('m4',JSON.stringify({W,D,H,wc,fl,style,P,items:items.map(({g,...r})=>r)}))}catch(e){}};

const S=new THREE.Scene(),cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true}),cam=new THREE.PerspectiveCamera(45,1,10,6000);
R.setPixelRatio(Math.min(devicePixelRatio,2));
S.background=new THREE.Color(matchMedia('(prefers-color-scheme:dark)').matches?'#161a21':'#e4e8ee');
S.add(new THREE.AmbientLight(0xffffff,.68));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(150,500,400);S.add(dl);
const room=new THREE.Group(),cab=new THREE.Group();S.add(room,cab);
const hl=new THREE.BoxHelper(new THREE.Mesh(new THREE.BoxGeometry(1,1,1)),0x00e5ff);hl.visible=false;S.add(hl);
const mc={},M=c=>typeof c=='string'?(mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c}))):c;
const bx=(g,w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);g.add(m)};
/* декорҳои ЛДСП / МДФ (текстураи воқеиро барнома худаш мекашад) */
const DEC=[{n:'Белый',c:'#f4f4f1',k:'p'},{n:'Слоновая кость',c:'#efe6d0',k:'p'},{n:'Ваниль',c:'#e6d8b4',k:'p'},{n:'Серый',c:'#9aa0a6',k:'p'},{n:'Антрацит',c:'#3b3f45',k:'p'},{n:'Дуб молочный',c:'#dcc9a4',k:'w'},{n:'Дуб сонома',c:'#c9b08a',k:'w'},{n:'Дуб золотой',c:'#c79a5b',k:'w'},{n:'Ясень светлый',c:'#e3d3b8',k:'w'},{n:'Ясень серый',c:'#8d8579',k:'w'},{n:'Бук',c:'#d8a46a',k:'w'},{n:'Вишня',c:'#9b4a2c',k:'w'},{n:'Орех',c:'#8a5a33',k:'w'},{n:'Венге',c:'#3a2a22',k:'w'},{n:'Груша',c:'#c98a45',k:'b'}];
const TOPS=[{n:'Чёрный гранит',c:'#26272a',k:'s'},{n:'Серый камень',c:'#6e7176',k:'s'},{n:'Бежевый камень',c:'#c8b894',k:'s'},{n:'Белый мрамор',c:'#e9e8e4',k:'m'},{n:'Серый мрамор',c:'#b9b9b6',k:'m'}];
const HANDS=[{n:'Золото',c:'#d4a937',k:'p'},{n:'Хром',c:'#b9bec6',k:'p'},{n:'Чёрный',c:'#222',k:'p'},{n:'Бронза',c:'#8b6b3a',k:'p'},{n:'Белый',c:'#f2f2f2',k:'p'}];
const R_=Math.random;
function tex(d){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=d.c;x.fillRect(0,0,128,128);
  const ln=(a,b,w,al,dk)=>{x.strokeStyle='rgba('+(dk?'0,0,0':'255,255,255')+','+al+')';x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.bezierCurveTo(a+R_()*5-2,b+30,a+R_()*5-2,b+70,a+R_()*5-2,b+110);x.stroke()};
  if(d.k=='w')for(let i=0;i<240;i++)ln(R_()*128,R_()*60-20,.5+R_()*1.6,.04+R_()*.1,R_()<.6);
  else if(d.k=='b')for(let i=0;i<260;i++){x.fillStyle='rgba('+(R_()<.5?'60,30,0':'255,220,160')+','+(.05+R_()*.1)+')';x.beginPath();x.ellipse(R_()*128,R_()*128,2+R_()*10,1+R_()*5,R_()*3,0,7);x.fill()}
  else if(d.k=='s'){for(let i=0;i<700;i++){x.fillStyle='rgba('+(R_()<.5?'255,255,255':'0,0,0')+','+R_()*.25+')';x.fillRect(R_()*128,R_()*128,1+R_()*2,1+R_()*2)}for(let i=0;i<10;i++)ln(R_()*128,R_()*40-20,.5+R_(),.18,false)}
  else if(d.k=='m')for(let i=0;i<9;i++)ln(R_()*128,R_()*30-10,.6+R_()*1.6,.12+R_()*.15,true);
  else for(let i=0;i<300;i++){x.fillStyle='rgba(0,0,0,'+R_()*.03+')';x.fillRect(R_()*128,R_()*128,2,2)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const tx=d=>d.t||(d.t=tex(d)),mat=d=>d.m||(d.m=new THREE.MeshLambertMaterial({map:tx(d)})),sw=d=>tx(d).image.toDataURL(),dm=(L,i)=>mat(L[i]||L[0]);

let az=.55,el=.75,ds=620;
function camUp(){const t=new THREE.Vector3(W/2,60,D/2);
  cam.position.set(t.x+ds*Math.sin(az)*Math.cos(el),t.y+ds*Math.sin(el),t.z+ds*Math.cos(az)*Math.cos(el));cam.lookAt(t)}
function buildRoom(){room.clear();
  bx(room,W,2,D,fl,W/2,-1,D/2);bx(room,W,H,2,wc,W/2,H/2,-1);bx(room,2,H,D,wc,-1,H/2,D/2);camUp()}

/* дарчаи классикӣ: чорчӯбаи тиллоӣ, панели баргашта ва ороиши тиллоӣ */
const GD='#d4a937';
function ell(g,rx,ry,rz,c,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),M(c));m.scale.set(rx,ry,rz);m.position.set(x,y,z);g.add(m)}
function dg(g,x1,y1,x2,y2,z,c){const l=Math.hypot(x2-x1,y2-y1),m=new THREE.Mesh(new THREE.BoxGeometry(l,.5,.5),M(c));m.position.set((x1+x2)/2,(y1+y2)/2,z);m.rotation.z=Math.atan2(y2-y1,x2-x1);g.add(m)}
function classic(g,x,y,w,h,z){const a=Math.min(6,w/5,h/5),L=x-w/2,Rr=x+w/2,T=y+h/2,B=y-h/2,zz=z+1.2;
  bx(g,w-a*2,1,1,GD,x,T-a,zz);bx(g,w-a*2,1,1,GD,x,B+a,zz);bx(g,1,h-a*2,1,GD,L+a,y,zz);bx(g,1,h-a*2,1,GD,Rr-a,y,zz);
  [[L,T,L+a,T-a],[Rr,T,Rr-a,T-a],[L,B,L+a,B+a],[Rr,B,Rr-a,B+a]].forEach(p=>dg(g,p[0],p[1],p[2],p[3],zz,'#d8c98f'));
  bx(g,w-a*2-3,h-a*2-3,.8,fac,x,y,z+1.4);
  if(w>=30&&h>=40){const o=Math.min(20,h*.17);ell(g,2.4,o,.8,GD,x,y,z+2.2);ell(g,1.5,o*.45,.7,GD,x,y+o*1.4,z+2.1);ell(g,1.5,o*.45,.7,GD,x,y-o*1.4,z+2.1)}}
/* t: b=поён, k=қуттиҳо, w=боло, t=пенал, c=гӯшавӣ, s=плита, p=колонна, m=карниз */
function build(it){
  const g=new THREE.Group(),{w,h,d,t}=it,pl=t=='w'?0:10,ct='bcsk'.includes(t)?4:0,bh=h-pl-ct,fy=pl+bh/2,fh=bh-.6,fz=d/2-1;
  fac=dm(DEC,t=='w'||t=='m'?P.up:P.fas);const BM=dm(DEC,P.kor),TM=dm(TOPS,P.top),PM=dm(DEC,P.col),HM=dm(HANDS,P.hand);
  if(t=='p'){bx(g,w,h,d,fac,0,h/2,0);const k=Math.max(3,Math.round(w/2.2));for(let i=1;i<=k;i++)bx(g,.9,h-30,.7,GD,-w/2+i*w/(k+1),h/2-4,d/2+.2);
    bx(g,w+2,5,d+2,fac,0,2.5,0);bx(g,w+2,3,d+2,fac,0,h-1.5,0);ell(g,w*.42,6,2.2,GD,0,h-12,d/2+1.2);ell(g,w*.3,3,2,GD,0,h-20,d/2+1.4);bx(g,w*.5,w*.5,1,GD,0,6+w*.3,d/2+.6);g.position.y=it.y||0;return g}
  if(t=='m'){bx(g,w,h*.45,d,fac,0,h*.225,0);bx(g,w,1.2,d+.4,'#c9a24a',0,h*.47,0);bx(g,w,h*.45,d+4,fac,0,h*.78,2);g.position.y=it.y||0;return g}
  bx(g,w-.2,bh,d-2,BM,0,fy,-1);
  if(pl)bx(g,w-4,pl,d-8,PM,0,pl/2,-4);
  if(ct)bx(g,w+.4,ct,d+2,TM,0,h-ct/2,1);
  const n=(t=='k')?0:(w>=75&&t!='s'&&t!='c')?2:1,fw=w/n;
  if(t=='k'){const c0=style=='classic',dh=fh/3;for(let j=0;j<3;j++){const y=pl+.3+dh*(j+.5);bx(g,w-.6,dh-.6,1.8,fac,0,y,fz);
    if(c0){classic(g,0,y,w,dh-.6,fz);{bx(g,Math.min(16,w*.3),.8,1.2,HM,0,y,fz+2.4);ell(g,2.6,1.4,1.2,HM,0,y,fz+2.6)}}else bx(g,Math.min(30,w*.5),1.2,2,HM,0,y+dh/2-6,fz+1.6)}}
  for(let i=0;i<n;i++){
    const x=-w/2+fw*(i+.5),fx=x+(n==2?(i?-1:1):1)*(fw/2-5);
    if(t=='s'){bx(g,fw-.6,fh,1.8,'#1b1b1b',x,fy,fz);bx(g,fw-16,fh-34,.6,'#4a4a4a',x,fy-4,fz+1.2);bx(g,fw-14,1.6,2.6,'#c8c8c8',x,fy+fh/2-9,fz+2.4);continue}
    bx(g,fw-.6,fh,1.8,fac,x,fy,fz);
    const cl=style=='classic';
    if(cl&&fw>22&&fh>22)classic(g,x,fy,fw,fh,fz);
    const hy=t=='w'?fy-fh/2+(cl?8:20):t=='t'?fy:fy+fh/2-(cl?8:20);
    if(cl)ell(g,2.2,1.6,1.2,HM,fx,hy,fz+2.4);else bx(g,1.2,Math.min(28,fh*.4),2,HM,fx,hy,fz+1.6);
  }
  if(t=='s'){bx(g,w-4,.8,d-8,'#111',0,h+.4,0);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(6,6,1,18),M('#666'));m.position.set(a*w/4,h+1,b*d/6);g.add(m)})}
  return g}

function place(it){const g=it.g;g.position.set(it.x,it.y||0,it.z);g.rotation.y=it.r*Q;g.userData.it=it;if(it==sel){hl.setFromObject(g);hl.visible=true}}
function one(it){cab.remove(it.g);it.g=build(it);cab.add(it.g);place(it)}
function all(){cab.clear();items.forEach(it=>{it.g=build(it);cab.add(it.g);place(it)})}
function addIt(it){items.push(it);it.g=build(it);cab.add(it.g);place(it);pick(it);sv()}

function snap(it,keep){
  const m=Math.min(it.z,D-it.z,it.x,W-it.x);
  if(!keep&&m<70)it.r=m==it.z?0:m==D-it.z?180:m==it.x?90:270;
  const q=it.r%180,ex=q?it.d:it.w,ez=q?it.w:it.d;
  let x=Math.min(Math.max(it.x,ex/2),W-ex/2),z=Math.min(Math.max(it.z,ez/2),D-ez/2);
  if(x-ex/2<6)x=ex/2;else if(W-x-ex/2<6)x=W-ex/2;
  if(z-ez/2<6)z=ez/2;else if(D-z-ez/2<6)z=D-ez/2;
  it.x=Math.round(x);it.z=Math.round(z)}

function fill(){if(!sel)return;$('iw').value=sel.w;$('ih').value=sel.h;$('id').value=sel.d}
function pick(it){sel=it;hl.visible=false;$('pn').classList.toggle('on',!!it);if(it){place(it);fill()}}

/* бо ангушт: кашидан, давр додан (камера), наздик кардан */
const rc=new THREE.Raycaster(),ptr=new Map(),pln=new THREE.Plane(new THREE.Vector3(0,1,0),0);let drag=null,pd=1;
const ndc=e=>{const r=cv.getBoundingClientRect();return new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1)};
const floorHit=e=>{rc.setFromCamera(ndc(e),cam);const p=new THREE.Vector3();return rc.ray.intersectPlane(pln,p)?p:null};
const pdist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size==2){drag=null;pd=pdist();return}
  rc.setFromCamera(ndc(e),cam);const h=rc.intersectObjects(cab.children,true)[0];
  if(h){let o=h.object;while(o&&!o.userData.it)o=o.parent;const it=o.userData.it;pick(it);const p=floorHit(e);drag=p?{it,dx:it.x-p.x,dz:it.z-p.z}:null}
  else{pick(null);drag=null}});
cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
  if(ptr.size==2){const d=pdist();ds=Math.min(2500,Math.max(120,ds*pd/d));pd=d;camUp();return}
  if(drag){const p=floorHit(e);if(p){drag.it.x=p.x+drag.dx;drag.it.z=p.z+drag.dz;snap(drag.it);place(drag.it);fill()}}
  else{az=Math.max(-1.5,Math.min(1.5,az-dx*.008));el=Math.max(.15,Math.min(1.45,el+dy*.006));camUp()}});
const up=e=>{ptr.delete(e.pointerId);if(drag)sv();drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* панел */
['w','h','d'].forEach(k=>$('i'+k).onchange=e=>{if(!sel)return;sel[k]=Math.min(400,Math.max(10,+e.target.value||sel[k]));snap(sel,true);one(sel);fill();sv()});
$('bRot').onclick=()=>{if(!sel)return;sel.r=(sel.r+90)%360;snap(sel,true);place(sel);sv()};
$('bCp').onclick=()=>{if(!sel)return;const n={...sel,g:null};n.x+=sel.w;snap(n,true);addIt(n)};
$('bDl').onclick=()=>{if(!sel)return;items=items.filter(i=>i!=sel);all();pick(null);sv()};

/* менюи «Илова» */
const TYPES=[['b',60,85,56,'Тумбаи поён 60'],['b',40,85,56,'Тумбаи поён 40'],['b',80,85,56,'Тумбаи поён 80 (2 дарча)'],['c',90,85,90,'Тумбаи гӯшавӣ'],['s',60,85,56,'Плита бо духовка'],['w',60,70,32,'Тумбаи боло 60'],['w',80,70,32,'Тумбаи боло 80 (2 дарча)'],['t',60,210,56,'Пенал'],['k',60,85,56,'Тумба бо 3 қутти (ящик)'],['p',10,215,56,'Колонна (пилястр)'],['m',120,10,34,'Карниз (боло)']];
TYPES.forEach(([t,w,h,d,nm])=>{const b=document.createElement('button');b.className='it';b.textContent=nm;
  b.onclick=()=>{closeSh();const it={t,w,h,d,x:W/2,z:d/2,y:t=='w'?140:t=='m'?210:0,r:0};snap(it);addIt(it)};$('lst').append(b)});
const closeSh=()=>document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));
document.querySelectorAll('.x').forEach(b=>b.onclick=closeSh);
$('bA').onclick=()=>{closeSh();pick(null);$('shA').classList.add('on')};
$('bR').onclick=()=>{closeSh();pick(null);$('rw').value=W;$('rd').value=D;$('rh').value=H;$('rwc').value=wc;$('rfl').value=fl;$('shR').classList.add('on')};

/* хона */
function roomSet(){W=Math.min(2000,Math.max(100,+$('rw').value||W));D=Math.min(2000,Math.max(100,+$('rd').value||D));H=Math.min(500,Math.max(200,+$('rh').value||H));
  wc=$('rwc').value;fl=$('rfl').value;buildRoom();items.forEach(i=>snap(i,true));all();sv()}
['rw','rd','rh'].forEach(i=>$(i).onchange=()=>{ds=Math.max(W,D)*1.5;roomSet()});
['rwc','rfl'].forEach(i=>$(i).oninput=roomSet);

/* услуб ва ранг */
const stTxt=()=>$('bS').textContent=style=='classic'?'Классика':'Хайтек';
$('bS').onclick=()=>{style=style=='classic'?'hitech':'classic';stTxt();all();sv()};
/* интихоби ранг ва декор барои ҳар қисм */
const PARTS=[['fas','Фасад (поён)',DEC],['up','Фасад боло',DEC],['kor','Корпус',DEC],['top','Столешница',TOPS],['col','Цоколь',DEC],['hand','Дастак',HANDS]];let cpart=null;
function renderC(){const b=$('cb');b.innerHTML='';
  if(!cpart){PARTS.forEach(([k,n,L])=>{const r=document.createElement('button');r.className='it';r.innerHTML='<b>'+n+'</b> — '+(L[P[k]]||L[0]).n+'<br><img class="sw" src="'+sw(L[P[k]]||L[0])+'">';r.onclick=()=>{cpart=k;renderC()};b.append(r)});return}
  const pr=PARTS.find(p=>p[0]==cpart),g=document.createElement('div');g.className='gr';
  const bk=document.createElement('button');bk.className='b g';bk.textContent='← '+pr[1];bk.onclick=()=>{cpart=null;renderC()};b.append(bk);
  pr[2].forEach((d,i)=>{const e=document.createElement('button');e.className='sq'+(P[cpart]==i?' on':'');e.style.backgroundImage='url('+sw(d)+')';e.innerHTML='<span>'+d.n+'</span>';e.onclick=()=>{P[cpart]=i;all();sv();renderC()};g.append(e)});b.append(g)}
$('bC').onclick=()=>{closeSh();pick(null);cpart=null;renderC();$('shC').classList.add('on')};

function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
ds=Math.max(W,D)*1.5;stTxt();buildRoom();all();
(function loop(){requestAnimationFrame(loop);R.render(S,cam)})();
</script></body></html>
