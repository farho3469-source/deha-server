<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<script>window.onerror=function(m,u,l){alert('Хато: '+m+' (сатр '+l+')');};</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>Деҳа</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;font-family:system-ui,sans-serif;background:#efece3;color:#222}
#hdr{position:relative;height:84px;background:#2f6b3a;flex:none;overflow:hidden}
#hdr svg{position:absolute;left:0;top:0;width:100%;height:100%}
#hdr .t{position:absolute;left:14px;top:10px;color:#fff;font-size:21px;font-weight:600}
#hdr .s{position:absolute;left:14px;top:40px;color:#dfe8dc;font-size:12px}
#out{position:absolute;right:10px;top:10px;display:none;background:rgba(0,0,0,.3);color:#fff;border:0;border-radius:14px;padding:5px 12px;font-size:13px}
#auth{flex:1;overflow-y:auto;padding:20px}
#auth h3{margin:0 0 12px;font-size:22px}
input,textarea,select{width:100%;padding:12px;margin:5px 0;font-size:16px;border:1px solid #ccc;border-radius:10px;background:#fff;font-family:inherit}
.btn{background:#2f6b3a;color:#fff;border:0;padding:12px 20px;font-size:16px;border-radius:10px}
.btn.g{background:#e6e3d9;color:#222}
#aerr{color:#b00020;font-size:14px;min-height:20px;margin:6px 0}
.link{color:#2f6b3a;text-decoration:underline;margin-top:16px}
#app{display:none;flex:1;min-height:0;flex-direction:column}
#views{flex:1;min-height:0;display:flex;flex-direction:column}
.sec{display:none;flex:1;min-height:0;flex-direction:column;position:relative}
.sec.on{display:flex}
.pad{overflow-y:auto;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;flex:none;background:#fff;border-bottom:1px solid #ddd}
.chip{flex:none;border:1px solid #2f6b3a;color:#2f6b3a;background:#fff;border-radius:16px;padding:6px 14px;font-size:14px}
.chip.on{background:#2f6b3a;color:#fff}
#msgs{flex:1;overflow-y:auto;padding:10px}
.b{max-width:84%;width:fit-content;margin:6px 0;padding:7px 10px;border-radius:14px;font-size:15px;word-break:break-word}
.ot{background:#fff;border-top-left-radius:4px}
.me{background:#dcf0d2;margin-left:auto;border-top-right-radius:4px}
.nm{font-size:12px;font-weight:600;color:#2f6b3a;margin-bottom:2px}
.tm{font-size:11px;color:#777;text-align:right;margin-top:3px}
.b img{display:block;max-width:100%;max-height:260px;border-radius:10px}
.b audio{width:230px;max-width:100%}
#comp{flex:none;display:flex;align-items:center;padding:8px;background:#fff;border-top:1px solid #ddd}
#bar{display:flex;flex:1;gap:6px;align-items:center}
#text{flex:1;border-radius:22px;padding:10px 14px;margin:0}
.ic{width:44px;height:44px;border:0;border-radius:50%;background:#2f6b3a;color:#fff;font-size:20px;flex:none;padding:0}
.ic.g{background:#e6e3d9;color:#222}
#rec{display:none;flex:1;align-items:center;gap:10px;color:#b00020;font-weight:600}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card .d{font-size:12px;color:#777;margin-top:6px}
.card img{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.price{display:inline-block;background:#dcf0d2;color:#27500A;border-radius:10px;padding:3px 10px;font-weight:600;margin:2px 0 6px}
.acts{display:flex;gap:8px;margin-top:8px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:10px;font-size:15px}
.acts a{background:#2f6b3a;color:#fff}
.acts button{background:#f3d6d6;color:#8a1c1c}
.fab{position:absolute;right:14px;bottom:14px;background:#2f6b3a;color:#fff;border:0;border-radius:26px;padding:13px 20px;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
nav{flex:none;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0;font-size:11px;color:#777}
nav button span{display:block;font-size:21px}
nav button.on{color:#2f6b3a;font-weight:600}
#lb{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:9;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%}
#adform{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:#efece3;z-index:8;flex-direction:column}
#adform .top{background:#2f6b3a;color:#fff;padding:14px;font-size:18px;font-weight:600;flex:none}
#adform .body{flex:1;overflow-y:auto;padding:14px}
#gform{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:10;align-items:center;justify-content:center}
#gform .gbox{background:#fff;border-radius:14px;padding:20px;width:84%;max-width:360px;text-align:center}
#gform .gbox h3{margin:0 0 6px;font-size:20px}
#gform .gbox p{margin:0 0 14px;color:#666;font-size:14px}
#gform .gbox .btn{width:100%;margin:5px 0}
</style>
</head>
<body>
<div id="hdr">
  <svg viewBox="0 0 360 84" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle cx="300" cy="24" r="12" fill="#FAC775"/>
    <path d="M0 84 L0 58 Q50 36 110 56 Q170 74 230 52 Q300 30 360 52 L360 84 Z" fill="#4c8f5a"/>
    <path d="M0 84 L0 68 Q70 54 150 68 Q250 82 360 64 L360 84 Z" fill="#27500A"/>
    <rect x="262" y="46" width="30" height="22" fill="#F5C4B3"/>
    <path d="M256 47 L277 31 L298 47 Z" fill="#993C1D"/>
    <rect x="272" y="55" width="8" height="13" fill="#712B13"/>
    <rect x="228" y="54" width="4" height="14" fill="#712B13"/>
    <circle cx="230" cy="50" r="9" fill="#27500A"/>
  </svg>
  <div class="t">Деҳа</div>
  <div class="s">Чат, бозор ва хабарҳои деҳа</div>
  <button id="out" onclick="logout()">Баромадан</button>
</div>

<div id="auth">
  <h3 id="atitle">Воридшавӣ</h3>
  <input id="rname" placeholder="Номи шумо" style="display:none">
  <input id="phone" type="tel" placeholder="Рақами телефон (+992...)">
  <input id="pass" type="password" placeholder="Парол (камаш 6 аломат)">
  <div id="aerr"></div>
  <button class="btn" id="abtn" onclick="submitAuth()">Ворид шудан</button>
  <p class="link" id="alink" onclick="toggleMode()">Сабти ном</p>
</div>

<div id="app">
  <div id="views">
    <div class="sec on" id="s1">
      <div class="chips" id="rooms"></div>
      <div id="msgs"></div>
      <div id="comp">
        <div id="bar">
          <button class="ic g" id="pbtn" aria-label="Расм">📷</button>
          <input id="text" placeholder="Паём нависед...">
          <button class="ic" id="sbtn" aria-label="Фиристодан">🎤</button>
        </div>
        <div id="rec">
          <span id="rt">● 0:00</span>
          <span style="flex:1"></span>
          <button class="ic g" id="rcancel" aria-label="Бекор">✕</button>
          <button class="ic" id="rsend" aria-label="Фиристодан">➤</button>
        </div>
      </div>
    </div>

    <div class="sec" id="s2">
      <div class="chips" id="adchips"></div>
      <div class="pad" id="ads" style="flex:1;padding-bottom:80px"></div>
      <button class="fab" onclick="openAd()">＋ Эълон</button>
    </div>

    <div class="sec" id="s3"><div class="pad" id="news"></div></div>

    <div class="sec" id="s4">
      <div class="pad">
        <input id="pw" type="password" placeholder="Пароли админ">
        <input id="nt" placeholder="Сарлавҳа">
        <textarea id="nx" rows="5" placeholder="Матни хабар"></textarea>
        <button class="btn" onclick="sendNews()">Нашр кардан</button>
      </div>
    </div>
  </div>
  <nav>
    <button id="b1" class="on" onclick="tab(1)"><span>💬</span>Чат</button>
    <button id="b2" onclick="tab(2)"><span>🐄</span>Бозор</button>
    <button id="b3" onclick="tab(3)"><span>📰</span>Хабарҳо</button>
    <button id="b4" onclick="tab(4)"><span>🔐</span>Админ</button>
  </nav>
</div>

<div id="adform">
  <div class="top">Эълони нав</div>
  <div class="body">
    <select id="adc">
      <option value="cow">Гов</option>
      <option value="sheep">Гӯсфанд</option>
      <option value="other">Дигар</option>
    </select>
    <input id="adt" placeholder="Сарлавҳа (масалан: Гови ширдеҳ)">
    <input id="adp" placeholder="Нарх (масалан: 8000 сомонӣ)">
    <textarea id="add" rows="4" placeholder="Тавсиф (синну сол, ҷой ва ғайра)"></textarea>
    <button class="btn g" style="width:100%;margin:6px 0" onclick="$('adphoto').click()">📷 Расм интихоб кунед</button>
    <div id="adpn" style="font-size:13px;color:#777;margin-bottom:10px">Расм интихоб нашудааст</div>
    <div style="font-size:13px;color:#777;margin-bottom:10px">Рақами телефони шумо дар эълон намоён мешавад.</div>
    <button class="btn" id="adsend" style="width:100%" onclick="submitAd()">Нашр кардан</button>
    <button class="btn g" style="width:100%;margin-top:8px" onclick="closeAd()">Бекор кардан</button>
  </div>
</div>

<div id="gform">
  <div class="gbox">
    <h3>Шумо кистед?</h3>
    <p>Ин барои гурӯҳҳои «Занҳо» ва дигарон лозим аст. Баъдтар тағйир намеёбад.</p>
    <button class="btn" onclick="setGender('m')">Мард</button>
    <button class="btn" onclick="setGender('f')">Зан</button>
  </div>
</div>

<input type="file" id="pfile" accept="image/*" style="display:none">
<input type="file" id="adphoto" accept="image/*" style="display:none">
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const CATS = { cow: 'Гов', sheep: 'Гӯсфанд', other: 'Дигар' };
let mode = 'login', socket = null, tok = '', myUid = '', room = 'village';
let adsData = [], adFilter = 'all', adFile = null, roomList = [];
let rec = null, chunks = [], recTimer = null, recStart = 0, recCancel = false, stream = null;

/* ---------- садои паёми нав ---------- */
let actx = null;
function unlockSound(){
  try {
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
['click', 'touchstart', 'keydown'].forEach((ev) => document.addEventListener(ev, unlockSound, { passive: true }));

function beep(){
  try {
    if (!actx || actx.state !== 'running') return;
    const t = actx.currentTime;
    [[880, 0], [1175, 0.15]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.25);
      o.connect(g); g.connect(actx.destination);
      o.start(t + d); o.stop(t + d + 0.3);
    });
    if (navigator.vibrate) navigator.vibrate(120);
  } catch (e) {}
}

function toggleMode(){
  mode = mode === 'login' ? 'register' : 'login';
  const reg = mode === 'register';
  $('rname').style.display = reg ? 'block' : 'none';
  $('atitle').textContent = reg ? 'Сабти ном' : 'Воридшавӣ';
  $('abtn').textContent = reg ? 'Сабти ном кардан' : 'Ворид шудан';
  $('alink').textContent = reg ? 'Ман ҳисоб дорам' : 'Сабти ном';
  $('aerr').textContent = '';
}

async function submitAuth(){
  $('aerr').textContent = 'Интизор шавед...';
  try {
    const r = await fetch('/api/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('rname').value, phone: $('phone').value, password: $('pass').value })
    });
    const d = await r.json();
    if (!r.ok){ $('aerr').textContent = d.error || 'Хато'; return; }
    localStorage.setItem('token', d.token);
    start(d.token);
  } catch (e) {
    $('aerr').textContent = 'Пайваст нашуд. Дубора кӯшиш кунед.';
  }
}

function logout(){ localStorage.removeItem('token'); location.reload(); }

function tab(n){
  for (let i = 1; i <= 4; i++){
    $('s' + i).classList.toggle('on', i === n);
    $('b' + i).classList.toggle('on', i === n);
  }
  if (n === 1) scrollDown();
}

function hhmm(t){ return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function scrollDown(){ const b = $('msgs'); b.scrollTop = b.scrollHeight; }
function mediaUrl(id){ return '/media/' + id + '?t=' + tok; }
function openImg(src){ $('lbimg').src = src; $('lb').style.display = 'flex'; }

function setGender(g){
  if (socket) socket.emit('setgender', g);
  $('gform').style.display = 'none';
}

/* ---------- чат ---------- */
function msgEl(m){
  const mine = m.uid && m.uid === myUid;
  const d = document.createElement('div');
  d.className = 'b ' + (mine ? 'me' : 'ot');
  if (!mine){
    const n = document.createElement('div'); n.className = 'nm'; n.textContent = m.name; d.append(n);
  }
  if (m.kind === 'image'){
    const im = document.createElement('img');
    im.loading = 'lazy'; im.src = mediaUrl(m.media); im.onload = scrollDown;
    im.onclick = () => openImg(im.src);
    d.append(im);
  } else if (m.kind === 'audio'){
    const a = document.createElement('audio');
    a.controls = true; a.preload = 'none'; a.src = mediaUrl(m.media);
    d.append(a);
  } else {
    const p = document.createElement('div'); p.textContent = m.text || ''; d.append(p);
  }
  const t = document.createElement('div'); t.className = 'tm'; t.textContent = hhmm(m.time); d.append(t);
  return d;
}
function addChat(m){ $('msgs').append(msgEl(m)); scrollDown(); }

function renderRooms(){
  const box = $('rooms'); box.innerHTML = '';
  roomList.forEach((r) => {
    const b = document.createElement('button');
    b.className = 'chip' + (r.id === room ? ' on' : '');
    b.textContent = r.title;
    b.onclick = () => selectRoom(r.id);
    box.append(b);
  });
}
function selectRoom(id){
  room = id; $('msgs').innerHTML = ''; renderRooms();
  if (socket) socket.emit('join', id);
}

/* ---------- бозор ---------- */
function renderAdChips(){
  const box = $('adchips'); box.innerHTML = '';
  [['all', 'Ҳама'], ['cow', 'Гов'], ['sheep', 'Гӯсфанд'], ['other', 'Дигар']].forEach(([k, t]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (adFilter === k ? ' on' : '');
    b.textContent = t;
    b.onclick = () => { adFilter = k; renderAdChips(); renderAds(); };
    box.append(b);
  });
}
function adEl(a){
  const c = document.createElement('div'); c.className = 'card';
  if (a.photo){
    const im = document.createElement('img');
    im.loading = 'lazy'; im.src = mediaUrl(a.photo); im.alt = a.title;
    im.onclick = () => openImg(im.src);
    c.append(im);
  }
  const h = document.createElement('b'); h.textContent = a.title; c.append(h);
  if (a.price){ const p = document.createElement('div'); p.className = 'price'; p.textContent = a.price; c.append(p); }
  if (a.desc){ const d = document.createElement('div'); d.textContent = a.desc; c.append(d); }
  const w = document.createElement('div'); w.className = 'd';
  w.textContent = (CATS[a.cat] || '') + ' · ' + a.name + ' · ' + new Date(a.time).toLocaleDateString();
  c.append(w);
  const acts = document.createElement('div'); acts.className = 'acts';
  const tel = document.createElement('a'); tel.href = 'tel:+' + a.phone; tel.textContent = '📞 Занг задан';
  acts.append(tel);
  if (a.uid === myUid){
    const del = document.createElement('button'); del.textContent = '🗑 Нест кардан';
    del.onclick = () => { if (confirm('Эълон нест шавад?')) socket.emit('addel', a.id); };
    acts.append(del);
  }
  c.append(acts);
  return c;
}
function renderAds(){
  const box = $('ads'); box.innerHTML = '';
  const list = adsData.filter((a) => adFilter === 'all' || a.cat === adFilter);
  if (!list.length){
    const e = document.createElement('div'); e.className = 'card'; e.textContent = 'Ҳоло эълон нест. Аввалин шумо гузоред!';
    box.append(e); return;
  }
  list.forEach((a) => box.append(adEl(a)));
}
function openAd(){ $('adform').style.display = 'flex'; }
function closeAd(){ $('adform').style.display = 'none'; }
$('adphoto').onchange = () => {
  adFile = $('adphoto').files[0] || null;
  $('adpn').textContent = adFile ? '✔ ' + adFile.name : 'Расм интихоб нашудааст';
};
async function submitAd(){
  const title = $('adt').value.trim();
  if (!title){ alert('Сарлавҳа нависед'); return; }
  $('adsend').disabled = true; $('adsend').textContent = 'Интизор шавед...';
  try {
    let photo = '';
    if (adFile) photo = await upload('image/jpeg', await shrink(adFile));
    socket.emit('ad', { cat: $('adc').value, title, price: $('adp').value, desc: $('add').value, photo });
    $('adt').value = ''; $('adp').value = ''; $('add').value = '';
    adFile = null; $('adphoto').value = ''; $('adpn').textContent = 'Расм интихоб нашудааст';
    closeAd();
  } catch (e) {
    alert('Фиристода нашуд. Дубора кӯшиш кунед.');
  }
  $('adsend').disabled = false; $('adsend').textContent = 'Нашр кардан';
}

/* ---------- хабарҳо ---------- */
function addNews(n, top){
  const c = document.createElement('div'); c.className = 'card';
  const h = document.createElement('b'); h.textContent = n.title;
  const p = document.createElement('div'); p.textContent = n.text;
  const d = document.createElement('div'); d.className = 'd'; d.textContent = new Date(n.time).toLocaleDateString();
  c.append(h, p, d);
  top ? $('news').prepend(c) : $('news').append(c);
}

/* ---------- пайвастшавӣ ---------- */
function start(token){
  tok = token;
  $('auth').style.display = 'none';
  $('app').style.display = 'flex';
  $('out').style.display = 'block';
  renderAdChips();
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => { if (e && e.message === 'auth') logout(); });
  socket.on('me', (id) => { myUid = id; });
  socket.on('needgender', () => { $('gform').style.display = 'flex'; });
  socket.on('rooms', (list) => {
    roomList = list;
    if (!list.some((r) => r.id === room)) room = 'village';
    renderRooms();
    if (room !== 'village') socket.emit('join', room);
  });
  socket.on('init', (d) => {
    $('news').innerHTML = '';
    d.news.forEach((n) => addNews(n, false));
    adsData = d.ads; renderAds();
  });
  socket.on('history', (d) => {
    if (d.room !== room) return;
    $('msgs').innerHTML = '';
    d.chat.forEach(addChat);
  });
  socket.on('chat', (m) => {
    if (m.uid !== myUid) beep();
    if ((m.room || 'village') === room) addChat(m);
  });
  socket.on('news', (n) => addNews(n, true));
  socket.on('ad', (a) => { adsData.unshift(a); renderAds(); });
  socket.on('addel', (id) => { adsData = adsData.filter((a) => a.id !== id); renderAds(); });
  socket.on('err', (e) => alert(e));
}

function upload(type, buf){
  return new Promise((resolve, reject) => {
    socket.timeout(25000).emit('upload', { type, data: buf }, (err, r) => {
      if (err || !r || r.error) reject(new Error((r && r.error) || 'timeout'));
      else resolve(r.id);
    });
  });
}

function sendChat(){
  const text = $('text').value.trim();
  if (!text || !socket) return;
  socket.emit('chat', { room, kind: 'text', text });
  $('text').value = '';
  upd();
}
function upd(){ $('sbtn').textContent = $('text').value.trim() ? '➤' : '🎤'; }
$('text').addEventListener('input', upd);
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
$('sbtn').onclick = () => { if ($('text').value.trim()) sendChat(); else startRec(); };

$('pbtn').onclick = () => $('pfile').click();
$('pfile').onchange = () => { sendPhoto($('pfile').files[0]); $('pfile').value = ''; };

async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1100 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.75));
  return blob.arrayBuffer();
}
async function sendPhoto(file){
  if (!file || !socket) return;
  try {
    const id = await upload('image/jpeg', await shrink(file));
    socket.emit('chat', { room, kind: 'image', media: id });
  } catch (e) {
    alert('Расм фиристода нашуд');
  }
}

function fmt(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

async function startRec(){
  if (!socket || (rec && rec.state === 'recording')) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert('Микрофон иҷозат надорад');
    return;
  }
  const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4']
    .find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  const opts = mt ? { mimeType: mt, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 };
  rec = new MediaRecorder(stream, opts);
  chunks = []; recCancel = false;
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    clearInterval(recTimer);
    stream.getTracks().forEach((t) => t.stop());
    $('rec').style.display = 'none'; $('bar').style.display = 'flex';
    if (recCancel) return;
    const dur = Math.round((Date.now() - recStart) / 1000);
    if (dur < 1) return;
    const mime = rec.mimeType || 'audio/webm';
    const buf = await new Blob(chunks, { type: mime }).arrayBuffer();
    if (buf.byteLength > 1900000){ alert('Паём аз ҳад дароз аст'); return; }
    try {
      const id = await upload(mime.split(';')[0], buf);
      socket.emit('chat', { room, kind: 'audio', media: id, dur });
    } catch (e) {
      alert('Овоз фиристода нашуд');
    }
  };
  rec.start();
  recStart = Date.now();
  $('bar').style.display = 'none'; $('rec').style.display = 'flex';
  $('rt').textContent = '● 0:00';
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('rt').textContent = '● ' + fmt(s);
    if (s >= 60) stopRec(false);
  }, 300);
}
function stopRec(cancel){
  recCancel = cancel;
  if (rec && rec.state !== 'inactive') rec.stop();
}
$('rsend').onclick = () => stopRec(false);
$('rcancel').onclick = () => stopRec(true);

function sendNews(){
  if (!socket) return;
  socket.emit('news', { password: $('pw').value, title: $('nt').value, text: $('nx').value });
  $('nt').value = ''; $('nx').value = '';
}

const saved = localStorage.getItem('token');
if (saved) start(saved);
